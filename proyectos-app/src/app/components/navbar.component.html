<nav
  class="bg-gradient-to-b from-amber-900 to-amber-950 border-b-4 border-amber-700 shadow-lg relative overflow-hidden"
>
  <!-- Decorative wood texture -->
  <div
    class="absolute inset-0 opacity-10 pointer-events-none"
    style="
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.1) 2px,
        rgba(0, 0, 0, 0.1) 4px
      );
    "
  ></div>

  <div class="max-w-7xl mx-auto px-4 py-4 relative z-10">
    <div class="flex items-center justify-between">
      <!-- Logo/Title -->
      <div class="flex items-center space-x-3">
        <div class="text-4xl">🤠</div>
        <div class="border-l-4 border-amber-600 pl-4">
          <h1
            class="text-3xl font-black text-amber-100 tracking-wider"
            style="font-family: 'Georgia', serif; text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.5)"
          >
            MAURICIO NOJ
          </h1>
          <p
            class="text-xs text-amber-300 tracking-widest uppercase"
            style="font-family: 'Georgia', serif"
          >
            ~ Desarrollador de Código ~
          </p>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="hidden md:flex items-center space-x-8">
        <a
          href="#home"
          class="text-amber-100 hover:text-yellow-300 transition font-bold uppercase tracking-wider text-sm"
          style="font-family: 'Georgia', serif; text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.3)"
        >
          Inicio
        </a>
        <a
          href="#proyectos"
          class="text-amber-100 hover:text-yellow-300 transition font-bold uppercase tracking-wider text-sm"
          style="font-family: 'Georgia', serif; text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.3)"
        >
          Proyectos
        </a>
        <a
          href="#skills"
          class="text-amber-100 hover:text-yellow-300 transition font-bold uppercase tracking-wider text-sm"
          style="font-family: 'Georgia', serif; text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.3)"
        >
          Habilidades
        </a>
        <a
          href="#contacto"
          class="text-amber-100 hover:text-yellow-300 transition font-bold uppercase tracking-wider text-sm"
          style="font-family: 'Georgia', serif; text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.3)"
        >
          Contacto
        </a>
      </div>

      <!-- CTA Button -->
      <button
        class="hidden md:block px-6 py-2 bg-red-700 hover:bg-red-800 text-amber-100 font-bold uppercase tracking-widest text-sm border-2 border-red-900 shadow-lg transition transform hover:scale-105"
        style="font-family: 'Georgia', serif; text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.3)"
      >
        ⚡ ¡Contrátame!
      </button>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMenu()" class="md:hidden text-amber-100 text-2xl">
        <span *ngIf="!menuOpen">☰</span>
        <span *ngIf="menuOpen">✕</span>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="menuOpen" class="md:hidden mt-4 pt-4 border-t-2 border-amber-700 space-y-3">
      <a href="#home" class="block text-amber-100 hover:text-yellow-300 font-bold uppercase text-sm"
        >Inicio</a
      >
      <a
        href="#proyectos"
        class="block text-amber-100 hover:text-yellow-300 font-bold uppercase text-sm"
        >Proyectos</a
      >
      <a
        href="#skills"
        class="block text-amber-100 hover:text-yellow-300 font-bold uppercase text-sm"
        >Habilidades</a
      >
      <a
        href="#contacto"
        class="block text-amber-100 hover:text-yellow-300 font-bold uppercase text-sm"
        >Contacto</a
      >
      <button
        class="w-full px-4 py-2 bg-red-700 hover:bg-red-800 text-amber-100 font-bold uppercase text-sm"
      >
        ⚡ ¡Contrátame!
      </button>
    </div>

  <!-- Decorative bottom border -->
  <div class="h-2 bg-gradient-to-r from-amber-700 via-yellow-600 to-amber-700"></div>
